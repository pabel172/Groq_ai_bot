name = "telegram-groq-ai-bot"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
GROQ_MODEL = "llama-3.3-70b-versatile"
SYSTEM_PROMPT = "You are a helpful, friendly and intelligent AI assistant."
MAX_HISTORY = "10"
TEMPERATURE = "0.7"
MAX_OUTPUT_TOKENS = "2048"

# Optional KV namespace for conversation memory
# kv_namespaces = [
#   { binding = "CONVERSATIONS", id = "<YOUR_KV_NAMESPACE_ID>" }
# ]
